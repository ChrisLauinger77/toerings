name: "release"

# Stage 1 (workflow_dispatch): build, test and package a release candidate. It
# never creates releases, tags or package-repository updates.
# Stage 2 (annotated vX.Y.Z tag with a Candidate-Run line): verify that
# candidate and publish its exact artifact bytes without rebuilding.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.result }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: validate version sources
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          result-encoding: string
          script: |
            const { validateVersions } = require("./.github/scripts/release.cjs")
            const { version } = require("./package.json")
            return validateVersions(`v${version}`)

  build-tauri:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-24.04"
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: ""
            archive-arch: ""
            artifact-name: "packages-linux-x86_64"
          - platform: macos-15
            rust-targets: aarch64-apple-darwin
            tauri-args: "--target aarch64-apple-darwin --bundles app"
            archive-arch: "aarch64"
            artifact-name: "packages-macos-aarch64"
          - platform: macos-15
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: "--target universal-apple-darwin --bundles app"
            archive-arch: "universal"
            artifact-name: "packages-macos-universal"
          - platform: "windows-latest"
            rust-targets: "x86_64-pc-windows-msvc"
            tauri-args: "--target x86_64-pc-windows-msvc --bundles nsis"
            archive-arch: ""
            artifact-name: "packages-windows-x86_64"

    runs-on: ${{ matrix.platform }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm squashfs-tools xvfb
      - name: install frontend dependencies
        run: npm ci
      - name: validate frontend
        run: |
          npm run check
          npm run lint
          npm test
          npm run build
      - name: test native collectors and lifecycle
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        id: tauri
        with:
          args: ${{ matrix.tauri-args }} -- --locked
      - name: "smoke-test Windows startup"
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $binaryPath = "src-tauri/target/x86_64-pc-windows-msvc/release/ToeRings.exe"
          $stdoutPath = Join-Path $env:RUNNER_TEMP "toerings-stdout.log"
          $stderrPath = Join-Path $env:RUNNER_TEMP "toerings-stderr.log"
          $process = Start-Process `
            -FilePath $binaryPath `
            -PassThru `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            Write-Host "ToeRings exited with code $($process.ExitCode)"
            if (Test-Path -LiteralPath $stdoutPath) { Get-Content -LiteralPath $stdoutPath }
            if (Test-Path -LiteralPath $stderrPath) { Get-Content -LiteralPath $stderrPath }
            throw "ToeRings did not remain running during the startup smoke test"
          }
          Stop-Process -Id $process.Id -Force
      - name: repack AppImage without host infrastructure libraries
        if: matrix.platform == 'ubuntu-24.04'
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          appimage_path=$(jq -r '.[] | select(endswith(".AppImage"))' <<< "$ARTIFACT_PATHS")
          test -n "$appimage_path"
          scripts/repack-appimage.sh "$appimage_path"
      - name: validate Linux bundles
        if: matrix.platform == 'ubuntu-24.04'
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          deb_path=$(jq -r '.[] | select(endswith(".deb"))' <<< "$ARTIFACT_PATHS")
          rpm_path=$(jq -r '.[] | select(endswith(".rpm"))' <<< "$ARTIFACT_PATHS")
          appimage_path=$(jq -r '.[] | select(endswith(".AppImage"))' <<< "$ARTIFACT_PATHS")
          test -n "$deb_path" && test -n "$rpm_path" && test -n "$appimage_path"
          scripts/validate-linux-bundles.sh "$deb_path" "$rpm_path" "$appimage_path"
      - name: stage Linux bundles
        if: matrix.platform == 'ubuntu-24.04'
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          jq -r '.[] | select(endswith(".deb") or endswith(".rpm") or endswith(".AppImage"))' \
            <<< "$ARTIFACT_PATHS" | while read -r artifact_path; do
              cp "$artifact_path" "$RUNNER_TEMP/release/"
            done
      - name: verify macOS app signature
        if: startsWith(matrix.platform, 'macos')
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          app_path=$(jq -r '.[] | select(endswith(".app"))' <<< "$ARTIFACT_PATHS" | head -n 1)
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=4 "$app_path"
      - name: stage macOS app archive
        if: startsWith(matrix.platform, 'macos')
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          app_path=$(jq -r '.[] | select(endswith(".app"))' <<< "$ARTIFACT_PATHS" | head -n 1)
          mkdir -p "$RUNNER_TEMP/release"
          archive_path="$RUNNER_TEMP/release/ToeRings_${VERSION}_${{ matrix['archive-arch'] }}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$archive_path"
      - name: "stage Windows installer and portable ZIP"
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP "release")
          function Write-Checksum([string] $path) {
            $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            $checksumLine = "$checksum  $([System.IO.Path]::GetFileName($path))`n"
            [System.IO.File]::WriteAllText(
              "$path.sha256",
              $checksumLine,
              [System.Text.UTF8Encoding]::new($false)
            )
          }
          $installerPaths = @(
            $env:ARTIFACT_PATHS |
              ConvertFrom-Json |
              Where-Object { $_.EndsWith(".exe", [System.StringComparison]::OrdinalIgnoreCase) }
          )
          if ($installerPaths.Count -eq 0) {
            throw "NSIS installer not found in Tauri artifact paths"
          }
          foreach ($installerPath in $installerPaths) {
            $stagedPath = Join-Path $releaseDir ([System.IO.Path]::GetFileName($installerPath))
            Copy-Item -LiteralPath $installerPath -Destination $stagedPath
            Write-Checksum $stagedPath
          }
          $binaryPath = "src-tauri/target/x86_64-pc-windows-msvc/release/ToeRings.exe"
          $archivePath = Join-Path $releaseDir "ToeRings_$($env:VERSION)_windows_x86_64_portable.zip"
          if (-not (Test-Path -LiteralPath $binaryPath)) {
            throw "Windows executable not found: $binaryPath"
          }
          Compress-Archive -LiteralPath $binaryPath -DestinationPath $archivePath
          Write-Checksum $archivePath
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [validate, build-tauri]
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - name: require every release asset and generate SHA256SUMS
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ASSET_DIR: ${{ runner.temp }}/release-assets
          VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const { writeChecksums } = require("./.github/scripts/release.cjs")
            writeChecksums(process.env.ASSET_DIR, process.env.VERSION)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: print the commands to publish this candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const { candidateSummary } = require("./.github/scripts/release.cjs")
            const version = process.env.VERSION
            if (process.env.GITHUB_RUN_ATTEMPT !== "1") {
              throw new Error("Reruns cannot be published; start a new manual candidate run")
            }
            const branch = context.payload.repository.default_branch
            if (context.ref !== `refs/heads/${branch}`) {
              await core.summary
                .addRaw(`Candidate built from ${context.ref}; only ${branch} can be published.\n`)
                .write()
              return
            }
            const tagExists = await github.rest.git
              .getRef({ ...context.repo, ref: `tags/v${version}` })
              .then(() => true, error => {
                if (error.status === 404) return false
                throw error
              })
            if (tagExists) {
              await core.summary
                .addRaw(`Tag v${version} already exists; bump the version for a new release.\n`)
                .write()
              return
            }
            const text = candidateSummary({
              version,
              commit: context.sha,
              runId: context.runId,
              retentionDays: 30
            })
            console.log(text)
            await core.summary.addRaw(text).write()

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: verify annotated tag and candidate run
        id: candidate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { validateVersions, resolveCandidate } = require("./.github/scripts/release.cjs")
            const tag = context.ref.replace("refs/tags/", "")
            validateVersions(tag)
            const branch = context.payload.repository.default_branch
            const candidate = await resolveCandidate(github, context.repo, tag, branch)
            if (candidate.commit !== context.sha) {
              throw new Error("Release tag does not point to the checked-out commit")
            }
            core.setOutput("run-id", String(candidate.runId))
            core.setOutput("artifact-id", String(candidate.artifactId))
            core.setOutput("commit", candidate.commit)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact-id }}
          run-id: ${{ steps.candidate.outputs.run-id }}
          github-token: ${{ github.token }}
          digest-mismatch: error
          path: ${{ runner.temp }}/candidate
      - name: verify checksums and publish the candidate assets
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ASSET_DIR: ${{ runner.temp }}/candidate
          COMMIT: ${{ steps.candidate.outputs.commit }}
        with:
          script: |
            const { validateVersions, verifyChecksums, publishRelease } = require("./.github/scripts/release.cjs")
            const tag = context.ref.replace("refs/tags/", "")
            const files = verifyChecksums(process.env.ASSET_DIR, validateVersions(tag))
            const body = [
              "Download the bundle for your platform from the assets below.",
              "",
              "Windows releases include an NSIS installer and a portable ZIP for package managers such as Scoop. The Windows binaries are not code-signed, so Microsoft Defender SmartScreen may show a warning.",
              "",
              "macOS builds are ad-hoc signed but cannot be notarized without a paid Apple Developer Program membership. On first launch, Control-click ToeRings and choose Open. See the README for additional Gatekeeper instructions."
            ].join("\n")
            await publishRelease(github, context.repo, tag, process.env.COMMIT, body, files)

  update-package-repositories:
    name: "Request package repository updates"
    permissions:
      contents: read
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    needs: publish-release
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ secrets.PACKAGE_REPOSITORIES_TOKEN }}

    steps:
      - name: "Use scheduled fallback when no cross-repository token exists"
        if: ${{ env.GH_TOKEN == '' }}
        run: |
          echo "PACKAGE_REPOSITORIES_TOKEN is not configured; the daily Scoop and Homebrew updaters will pick up this version."
      - name: "Dispatch Scoop and Homebrew updates"
        if: ${{ env.GH_TOKEN != '' }}
        shell: bash
        run: |
          gh api --method POST repos/ChrisLauinger77/scoop-bucket/dispatches -f event_type=update-scoop
          gh api --method POST repos/ChrisLauinger77/homebrew-cask/dispatches -f event_type=update-cask -F 'client_payload[cask]=toerings'

  publish-winget:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    needs: publish-release

    steps:
      - name: "request WinGet manifest update"
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: "ChrisLauinger77.ToeRings"
          release-tag: "${{ github.ref_name }}"
          installers-regex: "^ToeRings_[0-9]+\\.[0-9]+\\.[0-9]+_x64-setup\\.exe$"
          token: "${{ secrets.WINGET_TOKEN }}"
